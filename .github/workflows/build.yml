name: Dauntless Fenys - Instaladores

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    name: Instalador Windows
    runs-on: windows-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar instalador Windows
        # Also validates the official VPN installer on real Windows without installing it.
        run: npm run build:win

      - name: Conferir instalador oficial do Tailscale no Windows
        run: node -e "require('./src/fenys-tailscale').downloadInstaller(require('node:path').join(process.env.RUNNER_TEMP,'fenys-tailscale-check')).then(()=>console.log('Checksum e assinatura oficial do Tailscale confirmados.')).catch(e=>{console.error(e.message);process.exit(1)})"

      - name: Salvar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Dauntless-Fenys-Windows
          path: release/*.exe
          if-no-files-found: error

  linux:
    name: Instaladores Linux
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar instaladores Linux
        run: npm run build:linux

      - name: Salvar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: Dauntless-Fenys-Linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

