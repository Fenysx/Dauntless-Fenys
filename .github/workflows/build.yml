name: Dauntless Fenys - Instaladores

# Builds sao manuais para economizar a franquia gratuita do GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dauntless-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Instalador Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Gerar instalador Windows
        run: npm run build:win
      - name: Salvar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Dauntless-Fenys-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
