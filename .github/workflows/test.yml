name: Fenys - Testes da API

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Validar codigo e contratos
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Conferir sintaxe
        run: |
          for file in src/*.js; do node --check "$file"; done

      - name: Rodar testes
        run: node --test test/*.test.js

  metagame-integration:
    name: Compilar e iniciar API no Metagame real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Baixar Metagame compativel
        uses: actions/checkout@v4
        with:
          repository: mixutin/dauntless-revived
          ref: 29477558148a9db66cd1134a5c3df8bea7f9bea5
          path: test-upstream
      - name: Instalar dependencias do Metagame
        run: npm ci
        working-directory: test-upstream/UndauntedMetagame
      - name: Validar convite simples e conta do amigo no Metagame real
        run: node test/integration-connection.cjs

      - name: Compilar overlay e testar servidor real
        run: node test/integration-host.cjs

      - name: Validar banco global entre dois hosts independentes
        run: node test/integration-cloud.cjs

