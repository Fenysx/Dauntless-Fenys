name: Fenys - Testes da API

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: dauntless-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Validar codigo e contratos
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Conferir sintaxe
        shell: bash
        run: |
          for file in src/*.js scripts/*.cjs; do node --check "$file"; done

      - name: Rodar testes
        run: node --test test/*.test.js

  metagame-integration:
    name: Compilar e iniciar API no Metagame real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Testar a base do servidor incluída neste repositório
        run: npm run test:integration
