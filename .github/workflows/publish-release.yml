name: Fenys - Publicar versao de testes

on:
  workflow_run:
    workflows: ["Dauntless Fenys - Instaladores"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID de compilacao concluida e aprovada para a branch main"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Publicar instaladores na Release
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo da main
        uses: actions/checkout@v4

      - name: Identificar versao
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verificar origem e sucesso da compilacao
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main"
          test "$RUN_ID" != ""
          RUN_INFO=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          STATUS=$(echo "$RUN_INFO" | jq -r '.status')
          CONCLUSION=$(echo "$RUN_INFO" | jq -r '.conclusion')
          RUN_BRANCH=$(echo "$RUN_INFO" | jq -r '.head_branch')
          RUN_SHA=$(echo "$RUN_INFO" | jq -r '.head_sha')
          test "$STATUS" = "completed"
          test "$CONCLUSION" = "success"
          test "$RUN_BRANCH" = "main"
          test "$RUN_SHA" = "$GITHUB_SHA"

      - name: Confirmar testes do mesmo commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$GITHUB_SHA&event=push")
          TEST_RUN_ID=$(echo "$RUNS" | jq -r '.workflow_runs | map(select(.head_branch == "main")) | sort_by(.run_number) | last | .id // empty')
          test "$TEST_RUN_ID" != ""
          timeout 15m gh run watch "$TEST_RUN_ID" --exit-status --interval 15

      - name: Buscar instaladores da compilacao validada
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: Dauntless-Fenys-*
          merge-multiple: true
          path: release-assets

      - name: Conferir os tres instaladores
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release-assets/
          test "$(find release-assets -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.deb' | wc -l)" -eq 1

      - name: Criar Release de testes no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Dauntless Launcher Ultimate ${{ steps.version.outputs.tag }} - Testes"
          prerelease: true
          draft: false
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.deb
          body: |
            ## Dauntless Launcher Ultimate — versão beta
            Launcher comunitário para Dauntless Revived.

            **Interface 1.8.0-beta.3:** a aba Escolher servidor mostra somente Servidor local e Servidores da comunidade. A administração Google, sincronização e publicação HTTPS ficam em Configurações → Hospedar um servidor. O launcher informa quando o host ainda usa LAN/rede privada e não pode ser publicado. As instruções Tailscale antigas foram retiradas das telas normais.
            **Proteções 1.8.0-beta.2:** criar o primeiro personagem com Google exige confirmação e nome escolhido pelo jogador; quem já tem personagem deve vinculá-lo no host de origem. Se o servidor anterior estiver offline, a troca só prossegue após expirar o lease da nuvem, preservando o progresso.
            **Novidades 1.8 beta:** seleção simplificada **Servidor local** / **Servidores da comunidade**. Catálogo de hosts Google públicos, sino para convites por e-mail Google ou nome de usuário, aceitação/recusa, políticas de entrada livre, convite e VIP manual. Hosts podem publicar o endereço HTTPS com assinatura do servidor já integrado.
            **Hospedagem externa:** a API utiliza HTTPS com certificado válido, e as partidas dependem de IPv4 público acessível e UDP 8770–8777. O script `npm run host:run` permite executar os serviços em uma VPS Windows sem manter o Electron aberto. Consulte `docs/COMUNIDADE.md`.
            **Contas antigas:** migração de personagem requer integração do servidor de origem e confirmação de saves. As telas antigas de Tailscale e convites por chave saíram do fluxo principal, mas continuam no código por compatibilidade.
            **Segurança:** Supabase autentica o Google; o host valida permissões antes de admitir jogadores remotos. VIP significa autorização manual, sem cobrança automática.
            **Limitações da versão de testes:** não há relay UDP, sistema de pagamento nem validação de partida real em dois PCs externos ou VPS. A operação depende de configuração do host e de sua rede.

            Esta é uma pré-release destinada a testes, não uma versão final.


