name: Fenys - Publicar versao de testes

on:
  workflow_run:
    workflows: ["Dauntless Fenys - Instaladores"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID de compilacao concluida e aprovada para a branch main"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publicar:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Publicar instaladores na Release
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo da main
        uses: actions/checkout@v4

      - name: Identificar versao
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verificar origem e sucesso da compilacao
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main"
          test "$RUN_ID" != ""
          RUN_INFO=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          STATUS=$(echo "$RUN_INFO" | jq -r '.status')
          CONCLUSION=$(echo "$RUN_INFO" | jq -r '.conclusion')
          RUN_BRANCH=$(echo "$RUN_INFO" | jq -r '.head_branch')
          RUN_SHA=$(echo "$RUN_INFO" | jq -r '.head_sha')
          test "$STATUS" = "completed"
          test "$CONCLUSION" = "success"
          test "$RUN_BRANCH" = "main"
          test "$RUN_SHA" = "$GITHUB_SHA"

      - name: Confirmar testes do mesmo commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/test.yml/runs?head_sha=$GITHUB_SHA&event=push")
          echo "$RUNS" | jq -e '.workflow_runs | any(.head_branch == "main" and .status == "completed" and .conclusion == "success")'

      - name: Buscar instaladores da compilacao validada
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: Dauntless-Fenys-*
          merge-multiple: true
          path: release-assets

      - name: Conferir os tres instaladores
        shell: bash
        run: |
          set -euo pipefail
          ls -lh release-assets/
          test "$(find release-assets -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.deb' | wc -l)" -eq 1

      - name: Criar Release de testes no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Dauntless Fenys ${{ steps.version.outputs.tag }} - Testes"
          prerelease: true
          draft: false
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.deb
          body: |
            ## Dauntless Fenys — versão beta
            Launcher comunitário para Dauntless Revived.

            **Windows:** instalador para testes com convite e conexão privada por Tailscale.
            **Linux:** pacotes AppImage e deb compilados; o jogo via Wine/Proton ainda não foi validado.
            **Importante:** o jogo original não está incluído. Tailscale e configuração do servidor pelo dono são necessários.
            Atualizações automáticas dos mods e jogo ainda estão em desenvolvimento.

            Esta é uma pré-release destinada a testes, não uma versão final.

