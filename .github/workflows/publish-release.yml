name: Fenys - Publicar versao de testes

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID da compilacao concluida que contem os instaladores"
        required: true
        type: string
        default: "38189271812"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-release.yml"

permissions:
  actions: read
  contents: write

jobs:
  publicar:
    name: Publicar instaladores na Release
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo e metadados da versao
        uses: actions/checkout@v4

      - name: Identificar versao
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Buscar instaladores da compilacao aprovada
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id || '38189271812' }}
          github-token: ${{ github.token }}
          pattern: Dauntless-Fenys-*
          merge-multiple: true
          path: release-assets

      - name: Conferir os tres instaladores
        shell: bash
        run: |
          ls -lh release-assets/
          test "$(find release-assets -maxdepth 1 -name '*.exe' | wc -l)" -ge 1
          test "$(find release-assets -maxdepth 1 -name '*.AppImage' | wc -l)" -ge 1
          test "$(find release-assets -maxdepth 1 -name '*.deb' | wc -l)" -ge 1

      - name: Criar Release de testes no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Dauntless Fenys ${{ steps.version.outputs.tag }} - Testes"
          prerelease: true
          draft: false
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.deb
          body: |
            ## Dauntless Fenys - primeira versao de testes
            Launcher comunitario para Dauntless Revived.

            **Windows:** instalador .exe testado com inicializacao do jogo.
            **Linux:** pacotes AppImage e deb compilados; o jogo via Wine/Proton ainda nao foi validado.
            **Importante:** o jogo original nao esta incluido. Servidor remoto,
            convites de jogadores e atualizacoes automaticas ainda estao em desenvolvimento.

            Esta e uma pre-release destinada a testes, nao uma versao final.
