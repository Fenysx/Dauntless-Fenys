name: Fenys Classic 1.0.1 - instalador Windows
on:
  push:
    branches:
      - fix/v1-classic-api-convites-versao
  workflow_dispatch:
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar JavaScript
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check src/renderer.js
          node --check src/fenys-api.js
      - name: Testar integracao
        run: npm test
      - name: Compilar instalador
        run: npm run build:win
      - name: Disponibilizar instalador para testes
        uses: actions/upload-artifact@v4
        with:
          name: Dauntless-Fenys-Classic-1.0.1-Windows
          path: release/*.exe
          if-no-files-found: error
